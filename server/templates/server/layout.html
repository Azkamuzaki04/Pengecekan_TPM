{% load static %}

<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Server Monitoring - CHECKSHEET{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #172033;
        }

        .server-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .server-sidebar {
            width: 260px;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            overflow-y: auto;
        }

        .server-brand {
            height: 82px;
            padding: 15px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-brand img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #8a94a6;
            margin-top: 3px;
        }

        .server-label {
            padding: 24px 22px 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.4px;
            color: #929aaa;
        }

        .server-menu {
            padding: 0 12px;
        }

        .server-menu a {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 13px;
            margin-bottom: 3px;
            border-radius: 9px;
            color: #526174;
            text-decoration: none;
            font-size: 14px;
        }

        .server-menu a:hover {
            background: #f3f6fa;
            color: #004a99;
        }

        .server-menu a.active {
            background: #eaf2fb;
            color: #004a99;
            font-weight: 600;
        }

        .server-menu i {
            width: 20px;
            font-size: 17px;
        }

        .server-footer {
            margin: 20px 14px;
            padding: 15px;
            background: #f7f8fa;
            border-radius: 12px;
        }

        .server-footer strong {
            display: block;
            font-size: 13px;
        }

        .server-footer span {
            font-size: 11px;
            color: #929aaa;
        }

        /* ================= CONTENT ================= */

        .server-main {
            margin-left: 260px;
            width: calc(100% - 260px);
        }

        .server-topbar {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 35px;
        }

        .server-top-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #737d8e;
        }

        .server-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .server-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #eaf2fb;
            color: #004a99;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }

        .server-user-name {
            font-size: 13px;
            font-weight: 700;
        }

        .server-user-role {
            font-size: 11px;
            color: #8a94a6;
        }

        .server-content {
            padding: 34px 38px;
        }

        .eyebrow {
            color: #c8102e;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        h1 {
            margin: 7px 0 5px;
            font-size: 30px;
        }

        .page-description {
            color: #718096;
            margin-bottom: 28px;
        }

        /* ================= CARDS ================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 20px;
        }

        .stat-title {
            color: #778397;
            font-size: 12px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            margin-top: 10px;
        }

        .stat-description {
            color: #98a2b3;
            font-size: 11px;
            margin-top: 7px;
        }

        .status-online {
            color: #168a52;
        }

        .status-offline {
            color: #c8102e;
        }

        .content-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 24px;
            margin-bottom: 22px;
        }

        .content-card h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .content-card p {
            color: #7b8798;
        }

        /* ================= TABLE ================= */

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 11px;
            color: #8490a2;
            letter-spacing: .6px;
            padding: 13px;
            background: #f8f9fb;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 13px;
            font-size: 13px;
            border-bottom: 1px solid #edf0f3;
        }

        /* ================= BADGE ================= */

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-green {
            color: #168a52;
            background: #e8f7ef;
        }

        .badge-red {
            color: #c8102e;
            background: #fdecef;
        }

        .badge-blue {
            color: #004a99;
            background: #eaf2fb;
        }

        .badge-gray {
            color: #687386;
            background: #f0f2f5;
        }

        /* ================= BUTTON ================= */

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-blue {
            background: #004a99;
            color: white;
        }

        .btn-red {
            background: #c8102e;
            color: white;
        }

        @media(max-width: 1000px) {

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 700px) {

            .server-sidebar {
                width: 220px;
            }

            .server-main {
                margin-left: 220px;
                width: calc(100% - 220px);
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .server-content {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<div class="server-layout">

    {% include "server/_sidebar.html" %}

    <main class="server-main">

        <header class="server-topbar">

            <div class="server-top-title">
                SERVER MONITORING
            </div>

            <div class="server-user">

                <div class="server-avatar">
                    S
                </div>

                <div>
                    <div class="server-user-name">
                        {{ request.user.username }}
                    </div>

                    <div class="server-user-role">
                        System Administrator
                    </div>
                </div>

            </div>

        </header>

        <section class="server-content">

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

</body>
</html>
